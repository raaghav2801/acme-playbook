<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme × Zime — Living Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--mute:#5E6873;--line:#E3E8EE;--panel:#F4F6F9;--navy:#10233F;--blue:#1E5EFF;--blue-soft:#EAF0FF;--teal:#0E7C7B;--teal-soft:#E4F3F2;--amber:#B87400;--amber-soft:#FFF3D6;--red:#C8372D;--red-soft:#FCEBE9;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"IBM Plex Serif",Georgia,serif;--r:8px}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand .who{font-size:12px;color:var(--mute)}.brand .name{font-weight:600;font-size:18px;line-height:1.2}.brand .goal{font-size:12.5px;color:var(--mute);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r);font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;color:var(--mute)}
.nav button:hover{background:var(--panel)}.nav button.on{background:var(--blue-soft);color:var(--blue);font-weight:500}.nav button.on svg{color:var(--blue)}
.active{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px 12px}
.active .k{font-size:11px;color:var(--mute)}.active .v{font-weight:600;margin:2px 0 6px}
.link{border:0;background:none;padding:0;color:var(--blue);font-size:13px;font-weight:500}.link:hover{text-decoration:underline}
.btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:var(--r);font-size:13.5px;font-weight:500}.btn:hover{background:var(--panel)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#1749c9}.btn.sm{padding:5px 9px;font-size:12.5px}
.menu{display:none}
.main{padding:26px 34px 70px;max-width:1280px;width:100%}
h1{font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.2}h2{font-size:17px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 18px;max-width:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stagebar{display:grid;grid-template-columns:1fr 1fr auto;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.stagebar>div{padding:12px 16px;border-right:1px solid var(--line)}.stagebar>div:last-child{border-right:0;background:var(--panel)}
.stagebar .k{font-size:11.5px;color:var(--mute);margin-bottom:3px}.stagebar .v{font-size:14px}
.cov{display:flex;align-items:center;gap:12px}.ring{width:50px;height:50px;flex:none}.cov .num{font-size:19px;font-weight:600;line-height:1}.cov .lab{font-size:12px;color:var(--mute)}
/* playbook table */
.pb{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pb .hd,.pb .rw{display:grid;grid-template-columns:minmax(190px,.9fr) minmax(320px,1.9fr) minmax(220px,1fr);gap:0}
.pb .hd{background:var(--panel);font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.pb .hd>div,.pb .rw>div{padding:14px 16px;border-right:1px solid var(--line)}.pb .hd>div:last-child,.pb .rw>div:last-child{border-right:0}
.pb .rw{border-top:1px solid var(--line)}.pb .rw.done{background:#F8FCFB}
.act .t{display:flex;align-items:flex-start;gap:9px;font-weight:600}.act input{width:17px;height:17px;margin-top:3px;accent-color:var(--teal);flex:none}
.act .learn{font-size:12.5px;color:var(--mute);margin:6px 0 0 26px}.act .unk{font-size:12.5px;margin:8px 0 0 26px}.act .unk b{font-weight:500;color:var(--mute)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{border-radius:var(--r);padding:12px 14px;background:var(--panel);font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.45}
.qcard.top{background:var(--blue-soft)}.qcard .who{font-family:var(--sans);font-style:normal;font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:4px}
.qcard .src{font-family:var(--sans);font-style:normal;font-size:11.5px;color:var(--mute);margin-top:6px}
.qcard .cp{display:block;margin-top:6px}
.voice{display:flex;flex-direction:column;gap:8px}
.vc{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}
.vc .bar{grid-column:1/3;height:5px;background:var(--panel);border-radius:999px;overflow:hidden}.vc .bar i{display:block;height:100%;background:var(--navy)}
.vc .n{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;white-space:nowrap}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.t-green{background:var(--teal-soft);color:var(--teal)}.t-amber{background:var(--amber-soft);color:var(--amber)}.t-red{background:var(--red-soft);color:var(--red)}.t-blue{background:var(--blue-soft);color:var(--blue)}.t-grey{background:var(--panel);color:var(--ink)}
.note{margin:8px 0 0 26px;width:calc(100% - 26px);min-height:50px;border:1px solid var(--line);border-radius:var(--r);padding:8px;display:none;resize:vertical}.note.show{display:block}
/* AI checklist */
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.callc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;background:#fff}.callc.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.callc .t{font-weight:600}.callc .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.two{display:grid;grid-template-columns:1.55fr .95fr;gap:22px;align-items:start}
.ask{display:flex;gap:8px;margin-bottom:10px}.ask input{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.answer{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);font-size:14px;margin-bottom:10px;display:none}.answer.show{display:block}
.sec{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sec>button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:#fff;padding:12px 14px;text-align:left;font-weight:600}
.sec>button .cnt{background:var(--red-soft);color:var(--red);border-radius:999px;padding:1px 8px;font-size:12px}
.sec>button .sp{flex:1}.sec>button .caret{width:16px;height:16px;color:var(--mute);transition:transform .15s}.sec.open>button .caret{transform:rotate(180deg)}
.sec .body{display:none;padding:2px 14px 14px;border-top:1px solid var(--line)}.sec.open .body{display:block}
.prog{height:7px;background:var(--panel);border-radius:999px;overflow:hidden;margin:10px 0 12px}.prog i{display:block;height:100%;background:var(--teal);transition:width .25s}
.ci{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:26px 1fr auto;gap:10px}
.ci.cov{background:#F8FCFB;border-color:#CFE7E4}.ci.part{background:#FFFBF0;border-color:#F1E1B3}.ci.miss{background:#fff}
.ci .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
.ci.cov .ic{background:var(--teal);color:#fff}.ci.part .ic{background:var(--amber);color:#fff}.ci.miss .ic{background:var(--panel);color:var(--mute);border:1px solid var(--line)}
.ci .t{font-weight:600}.ci .d{font-size:13px;color:var(--mute)}
.ci .k{font-size:11px;color:var(--mute);margin-top:8px;letter-spacing:.02em}
.ci .ev{font-size:13.5px;margin-top:3px}
.ci .snip{font-size:12px;color:var(--blue);margin-top:4px}
.ci .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.obj{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.obj .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.obj .d{font-size:13.5px;margin-top:3px}.obj .q{font-size:13.5px;color:#222;margin-top:6px}
.obj .route{font-size:12.5px;color:var(--mute);margin-top:6px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:600}
.spk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.spk .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.spk .bar{height:6px;background:var(--panel);border-radius:999px;overflow:hidden}.spk .bar i{display:block;height:100%}
.crm{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.crm b{font-weight:500;color:var(--mute)}
.mail{white-space:pre-wrap;font-size:13.5px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;display:none;margin-top:10px}.mail.show{display:block}
/* deal movement & winloss */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi .k{font-size:13px;color:var(--mute)}.kpi .v{font-size:30px;font-weight:600;line-height:1.15;margin:4px 0}.kpi .v small{font-size:14px;color:var(--mute);font-weight:500}.kpi .d{font-size:12.5px}
.chart{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}.chart h3{margin:0 0 4px;font-size:15px;font-weight:600}.chart .legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.alert{border:1px solid #F3C9C4;background:#FFF7F6;border-radius:var(--r);padding:16px;margin-top:16px}
.alert h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--red)}.alert p{margin:0 0 12px;color:#6b3a35;font-size:13.5px}
.causes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cause{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.cause .t{font-weight:600;font-size:13.5px}.cause .v{font-size:26px;font-weight:600;margin:4px 0 0}.cause .d{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.steps{margin:14px 0 0;padding:0;list-style:none}.steps li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}.steps li b{display:block}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th,table.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}table.t th{font-size:12px;color:var(--mute);font-weight:600}
table.t th.s{cursor:pointer;user-select:none}table.t th.s:hover{color:var(--ink)}table.t td.num{font-variant-numeric:tabular-nums;text-align:right}table.t th.num{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scat{position:relative}.tip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12.5px;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}.field label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:#fff}
.tier{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:16px 18px}.tier .n{font-size:22px;font-weight:600}.tier.focus{border-left-color:var(--teal)}.tier.develop{border-left-color:var(--amber)}.tier.maintain{border-left-color:var(--navy)}.tier.deprioritize{border-left-color:var(--red)}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.def{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px}.def b{display:block;margin-bottom:3px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}.drawer.show{display:block}.drawer .pnl{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:#fff;padding:22px;overflow:auto;display:flex;flex-direction:column;gap:12px}.drawer textarea{flex:1;min-height:300px;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:13.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13.5px;display:none;z-index:60}
.mark{background:var(--amber-soft)}
@media(max-width:1080px){.pb .hd{display:none}.pb .rw{grid-template-columns:1fr}.pb .rw>div{border-right:0;border-top:1px solid var(--line)}.pb .rw>div:first-child{border-top:0}.two{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}.side .nav,.side .active{display:none}.side.open .nav,.side.open .active{display:flex}.side.open .active{display:block}.menu{display:inline-block}.main{padding:18px 16px 60px}.stagebar{grid-template-columns:1fr}.stagebar>div{border-right:0;border-bottom:1px solid var(--line)}.stagebar>div:last-child{border-bottom:0}.cards{grid-template-columns:1fr}.ci{grid-template-columns:26px 1fr}.ci>div:last-child{grid-column:2}}
html{scrollbar-width:thin;scrollbar-color:#CBD3DB #F4F6F9;overflow-y:scroll}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#F4F6F9}::-webkit-scrollbar-thumb{background:#CBD3DB;border-radius:999px;border:2px solid #F4F6F9}::-webkit-scrollbar-thumb:hover{background:#AEB8C2}
.chart svg text{font-family:var(--sans)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.ask,.btn,.note{display:none!important}.main{padding:0}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="who">Acme × Zime</div><div class="name">Living Playbook</div><div class="goal">Winning behaviours on partner calls, made consistent across Acme’s channel team — to grow MPSS registrations 30%.</div></div>
  <button class="btn menu" id="menuBtn">Menu</button>
  <nav class="nav" id="nav"></nav>
  <div class="active"><div class="k">Active playbook</div><div class="v" id="activeName"></div><button class="link" data-go="playbooks">Change playbook</button></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="notesBtn">Call notes</button><button class="btn" id="resetBtn">Reset</button></div>
</aside>
<main class="main" id="main"></main>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"><div class="pnl"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Call notes</h2><button class="btn sm" id="closeDrawer">Close</button></div><p class="sub" style="margin:0">Built from what you ticked and typed in the playbook. Paste into Salesforce or the follow-up.</p><textarea id="notesText"></textarea><button class="btn primary" id="copyNotes">Copy notes</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= DATA ======================= */
const ICONS={playbooks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',checklist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 12 5 5L20 6"/></svg>',movement:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',winloss:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>',reps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-6-6"/></svg>',intel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a2 2 0 0 1 2-2h8l6 6v12"/><path d="M9 9h2M9 13h6M9 17h6"/></svg>'};

const VOICE={ // voice-of-partner themes with frequency from the objection log (2,469 objections / 1,543 calls)
 pricing:{l:'Price vs competitors',n:328,d:'Budget category: pricing, licensing costs, pricing model, renewal costs'},
 mpssprice:{l:'MPSS pricing & licensing',n:62,d:'MPSS-specific: pricing 46, licensing 16'},
 mpssmodel:{l:'Who manages it? (co-managed confusion)',n:20,d:'MPSS: implementation, activation, support hours, EPSS→MPSS conversion'},
 clarity:{l:'What does this licence actually do?',n:394,d:'Feature clarity & support'},
 gaps:{l:'Missing feature',n:387,d:'Feature gaps & requests'},
 integ:{l:'Will it work with our AD / identity / tools?',n:259,d:'Integration & compatibility'},
 portal:{l:'Portal access / login',n:40,d:'Portal & platform access across Sales enablement and Others'},
 enable:{l:'Need training or certification',n:211,d:'Sales enablement'},
 bug:{l:'It broke / performance',n:157,d:'Product bug'},
 timeline:{l:'Implementation delay',n:106,d:'Timeline'},
 stake:{l:'No buy-in yet internally',n:69,d:'Stakeholder alignment'},
 comp:{l:'Competitor named',n:58,d:'Competitors — Fortinet, WatchGuard, Microsoft, ZTNA alternatives'},
 sec:{l:'Compliance requirement',n:81,d:'Security / compliance'},
 renew:{l:'Expired subscriptions to re-quote',n:0,d:'Seen in sample calls; not a category in the log yet'},
 eol:{l:'End-of-life hardware',n:0,d:'Seen in sample calls; not a category in the log yet'},
};
const VMAX=394;

const STAGES=[
 {id:'recruit',n:1,tab:'Recruit & onboard',goal:'Qualify a new partner against the ideal profile before spending enablement time — and get them able to transact on day one.',done:'Fit scored, channel conflict checked, portal access working, two people booked for enablement, first registration dated.',
  rows:[
   {cat:'Do they have the customers?',learn:'Whether the applicant already sells to organisations that need security, or is starting from zero. The VP’s position: it is not about more partners, it is about the right ones.',gen:'What kind of customers do you sell to today, and roughly how many?',top:'Which three of your customers would you bring us in the first quarter — and what do you sell them today?',tech:'Ask for named accounts, not a description of their market. A partner who cannot name three has no route to a registration, and no amount of enablement changes that.',unk:'If they cannot name three, park the application in nurture — no enablement slot yet.',voice:[]},
   {cat:'Where we would sit',learn:'Whether Acme replaces a line they already carry or becomes a fourth option they rarely lead with.',gen:'Which security vendors do you carry today?',top:'Who do those customers buy firewalls from today — and would we be replacing that, or sitting alongside it?',tech:'Replacing a line means the partner has a reason to learn ours. Sitting alongside usually means we get quoted only when the incumbent is unavailable.',unk:'Ask which vendor they hold certifications with; that is the line they lead with.',voice:['comp']},
   {cat:'Can they sell recurring?',learn:'Whether they can sell and support a subscription, or only resell hardware. Acme delivers MPSS — the partner sells it and stays the customer’s first point of contact.',gen:'Do you sell anything on a monthly subscription today, or is it all one-off hardware and licences?',top:'When something you sold breaks, does the customer call you or the vendor — and do you charge for that?',tech:'Paid support relationships are the real predictor. A partner whose relationship ends at the invoice has no habit of recurring revenue and will struggle to sell a managed service, whoever delivers it.',unk:'Ask whether they invoice anything monthly today — any product, not just security.',voice:['mpssmodel']},
   {cat:'Will they get trained?',learn:'The VP’s ideal partner understands technology and keeps up with it. Traditional, box-only partners who will not train are not the fit.',gen:'Who on your team would get certified?',top:'Name the two people you would put through enablement in the next 30 days — can we book it before we finish this call?',tech:'Ask for names and a date on the first call. Enablement that is not booked does not happen, and the VP’s own view is that people forget the trainings they did attend.',unk:'If no one can be named, they are a Maintain-tier partner at best — set expectations now.',voice:['enable']},
   {cat:'Channel conflict check',learn:'Whether the accounts they would bring are already registered by another partner or worked directly.',gen:'Are any of those accounts already buying Acme?',top:'Let me check those three names against existing registrations while we are on the call, so you do not spend a month on a deal that is already claimed.',tech:'Run the check live. Conflict discovered after a new partner has invested effort is the fastest way to lose them permanently.',unk:'Take the names and confirm within 48 hours; do not let them start prospecting blind.',voice:['stake']},
   {cat:'Make them able to transact',learn:'Whether they can log in, price and register on day one. Portal failure is Acme’s number-one known loss reason.',gen:'Let’s get your portal access working before we finish.',top:'Log in while we are on the call — if anything errors I would rather fix it now than have you hit it on your first deal.',tech:'Test the portal on the onboarding call, not after. On one sample call a partner had never been able to log in at all, and it surfaced only when she needed to quote a live renewal.',unk:'Raise the ticket on the call and give them the ticket number before hanging up.',voice:['portal','enable']},
   {cat:'First deal, dated',learn:'An agreed first registration with a date, so the onboarding investment is measurable.',gen:'What would a realistic first deal look like, and when?',top:'Which of those three accounts could be a registration in the next 60 days, and what do you need from me to get there?',tech:'A new partner without a first-deal date drifts into the long tail. Today 803 of Acme’s partner accounts have never appeared on a recorded call.',unk:'Agree a check-in date instead, and treat the account as unproven until a deal is named.',voice:[]},
  ],
  extra:`<h2>Ideal partner profile</h2><p class="sub" style="margin-bottom:10px">There is no filtering at onboarding today — anyone who applies becomes a partner. That is why the book looks the way it does: of 1,656 partner accounts in the data, 803 have never appeared on a recorded call, 34 have never registered anything, and the top 20% produce 70% of all registrations. Score every applicant against these five before granting an enablement slot.</p>
  <table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th><th>Evidence on the call</th><th>Weight</th></tr></thead><tbody>
  <tr><td><b>Real customer book</b></td><td>Can name three accounts they would bring this quarter.</td><td>Named accounts, with what they sell them today.</td><td><span class="tag t-red">Must have</span></td></tr>
  <tr><td><b>Security already in the mix</b></td><td>Already sells firewalls or security services to those accounts.</td><td>Names the vendor they carry and where Acme would sit.</td><td><span class="tag t-red">Must have</span></td></tr>
  <tr><td><b>Recurring-revenue habit</b></td><td>Has paid support contracts or monthly billing with customers today.</td><td>Customers call them, not the vendor — and they charge for it.</td><td><span class="tag t-amber">Strong signal</span></td></tr>
  <tr><td><b>Willing to be enabled</b></td><td>Two named people booked for enablement within 30 days.</td><td>Names and a date agreed on the call.</td><td><span class="tag t-amber">Strong signal</span></td></tr>
  <tr><td><b>Clean of conflict</b></td><td>Target accounts not already registered elsewhere.</td><td>Checked live against existing registrations.</td><td><span class="tag t-red">Must have</span></td></tr>
  </tbody></table>
  <p class="sub" style="margin-top:12px;font-size:13px">Three must-haves and at least one strong signal → onboard and set a 60-day first-deal date. Three must-haves only → onboard at low touch, no enablement slot yet. Anything less → nurture list, revisit in a quarter.</p>`},

 {id:'partner',n:2,tab:'Know the partner',goal:'Build the partner profile Acme doesn’t have and assign a tier from what we observe.',done:'Profile ≥ 80% complete, tier assigned, support needs routed.',
  rows:[
   {cat:'Partner business',learn:'How much of their business is security, and whether Acme is lead line or fallback.',gen:'Of the security deals you closed last quarter, how many went Acme?',top:'Think of the last three security deals you closed — which went Acme, which went elsewhere, and what decided each one?',tech:'Three deals they can recall beats ten they cannot. Anchor on their own recent wins rather than their opinion of Acme, and open with what you already know from their account so the call starts with specifics.',unk:'Ask for a rough split — mostly Acme / mixed / mostly others — and log it as an estimate.',voice:['enable','portal']},
   {cat:'Customer base',learn:'Who they sell to, and which customers are MPSS-shaped. A partner cannot tell you who monitors a customer’s firewall — but they know exactly which customers phone them for everything.',gen:'Which of your customers have no IT person of their own?',top:'Which three customers call you first whenever anything breaks — and what do they do out of hours when you are closed?',tech:'Ask what the partner experiences, not what happens inside the customer. The accounts that ring them for everything are the MPSS-shaped list, and they can name them without checking.',unk:'Ask which customers they hold support contracts with; it is the same list from another angle.',voice:['renew','eol']},
   {cat:'Competing lines',learn:'Which competitor is their default and why.',gen:'When a customer doesn’t name a brand, which firewall do you quote first?',top:'The last time you quoted a competitor instead of us — what tipped it: margin, their portal, their support, or price?',tech:'Ask about the last specific instance and offer the reason menu, so the partner can be honest quickly. Competitor is 2% of the objection log because nobody asks this.',unk:'Ask which vendor they are certified on; that is usually the default.',voice:['comp']},
   {cat:'Recurring-revenue habit',learn:'Whether they can sell and support a subscription, or only resell hardware. Acme runs MPSS; the partner sells it and stays the customer’s first point of contact.',gen:'Do you sell anything on a monthly subscription today, or is it all one-off hardware and licences?',top:'When something you sold breaks, does the customer call you or call us — and do you charge them for that?',tech:'Paid support relationships predict who can sell a managed service. A partner whose relationship ends at the invoice has no habit of recurring revenue, whoever delivers the service.',unk:'Ask whether they invoice anything monthly today — any product, not just security.',voice:['mpssmodel']},
   {cat:'Support needs',learn:'What is stopping them selling more Acme. Known loss reasons: the portal and pricing.',gen:'What’s the last thing that went wrong with Acme?',top:'The last time you chose another vendor over us, was it the product, the price, or something we made hard — like the portal or a ticket that went nowhere?',tech:'Name the known failure points so the partner doesn’t have to. Ladan gives a named escalation path; Hashem fixes portal access on the call instead of deferring it.',unk:'Ask when they last logged into the partner portal; a blank look is itself the answer.',voice:['portal','enable','clarity']},
   {cat:'Relationship cadence',learn:'How often Acme is in touch and whether that is enough.',gen:'How often should we be in touch, and about what?',top:'What would need to be true for you to bring me into a customer call before the quote goes out, not after?',tech:'Ask for the condition, not the frequency — it tells you what the partner values and where Acme is currently invisible.',unk:'Propose a cadence and confirm it.',voice:['enable']},
  ]},
 {id:'find',n:3,tab:'Find the MPSS deal',goal:'Turn general MPSS interest into one named customer with a named problem MPSS solves.',done:'A customer is named, the problem is clear, readiness score computed.',
  rows:[
   {cat:'Pain',learn:'A trigger, not general interest: incident, audit, renewal, security person leaving. Customers move when the current setup isn’t solving the problem.',gen:'What happened at this customer that made them start looking?',top:'What changed on their side — an incident, an audit finding, someone leaving — that means the current setup isn’t good enough anymore?',tech:'Ask for the trigger event, not the problem. Ladan spots an anomaly in the account (devices gone quiet) and asks what happened there — the specific beats the general.',unk:'Make it the partner’s action before the next call; offer to join their next customer meeting.',voice:['bug','sec','timeline'],sig:'usecase'},
   {cat:'Named customer',learn:'Which account, who decides. Without a name there is nothing to register.',gen:'Which customer are we talking about, and who decides there?',top:'Let’s make it concrete: which account, and who on their side signs off? If you registered it today, what would you type on the form?',tech:'Move from a category (“a dental firm”) to a name and a form field. Hashem turns a hypothetical into a registration conversation in the same breath.',unk:'Ask which existing customer is closest to this profile; start there.',voice:['stake'],sig:'client'},
   {cat:'MPSS positioned',learn:'Has the partner put MPSS in front of this customer, and how did they explain it?',gen:'Have you put MPSS in front of them yet?',top:'When you described MPSS to them, what words did you use — and what did they say back?',tech:'Ask for the partner’s own pitch. You hear whether the managed model landed or whether the customer heard “another licence”. MPSS clarity is the largest non-price MPSS objection.',unk:'Give the two-line pitch (Acme’s team watches and manages the firewall for the customer) and offer a joint demo.',voice:['mpssprice','clarity'],sig:'align'},
   {cat:'Who will manage it',learn:'Fully managed by Acme, or co-managed with the partner or customer keeping control. The biggest non-price MPSS objection is confusion here.',gen:'If a rule needs changing after hours, who does the customer expect to handle it?',top:'When something needs changing out of hours, does the customer expect to do it themselves, ring you, or have someone else own it? That answer decides managed or co-managed.',tech:'Ask about a concrete moment instead of the terms. Partners know who gets the call because they are usually the ones who get it — and the answer settles the model without a definitions conversation.',unk:'Ask what the customer does today (no one / IT generalist / partner helpdesk); confirm on the demo.',voice:['mpssmodel'],sig:'align'},
   {cat:'Demo',learn:'Does the customer want to see it, and who needs to be in the room?',gen:'Would they want to see it working?',top:'Who at the customer would need to see it working before they’d say yes — and can we get them and our engineer on the same call?',tech:'Ask for attendees, not “a demo”. Ladan books the solutions engineer with a stated purpose rather than offering a generic session.',unk:'Propose a demo and let the partner take the offer to the customer.',voice:['integ','clarity'],sig:'demo'},
   {cat:'Budget',learn:'In a channel deal the practical signal is a quote request or a number.',gen:'Has the customer asked you for a quote yet?',top:'Have they asked you for a number? If not, what would they need to hear before they do — and what do they think this costs today?',tech:'A quote request is the budget signal a partner can actually see. Hashem gives the partner their own cost first so the pricing conversation starts from facts.',unk:'Partner raises it at the next customer touch; Acme prepares indicative pricing.',voice:['pricing','mpssprice'],sig:'budget'},
   {cat:'Timeline',learn:'The date the customer cares about: contract end, audit, go-live, end-of-life.',gen:'Is there a date on their side this has to be done by?',top:'What’s the date that makes this urgent for them — contract end, an audit, a device going end-of-life — and what happens if it slips?',tech:'Use dates the partner can look up. Hashem uses last-order and retirement dates as the customer’s deadline rather than asking whether they have one.',unk:'Ask when the incumbent contract ends; that is the default date.',voice:['timeline','eol']},
   {cat:'Competition',learn:'Has anyone else quoted, and what?',gen:'Who else are they looking at?',top:'What’s installed there today, and has anyone quoted against it yet — on licence, appliance, or a managed price?',tech:'The incumbent is the competitor. Asking what basis they quoted on sets up the pricing reframe later.',unk:'Ask what the customer runs today; the incumbent is usually the competitor.',voice:['comp','pricing']},
  ]},
 {id:'register',n:4,tab:'Register the deal',goal:'Get the registration submitted while the signal is hot; remove portal friction on the spot.',done:'Registration ID, distributor named, PO owner and date logged, 30-day clock started.',
  rows:[
   {cat:'Readiness',learn:'Enough is known to register: four or more of the six signals.',gen:'Do we know enough to register this today?',top:'We have a named customer, a trigger and a date — what’s stopping us registering it right now so your pricing is protected?',tech:'Summarise the signals back, then ask what’s missing. Hashem states the protection and the commitment in one sentence so the partner sees the upside of acting now.',unk:'If the score is 2–3, go back a stage and book the missing item.',voice:['stake']},
   {cat:'Prompt the registration',learn:'Will the partner submit now, and through which distributor? Registered pricing only flows through the named distributor.',gen:'Can you submit it now, and through which distributor?',top:'I’ll stay on while you submit — which distributor is this going through, so the discounted quote lands in the right place?',tech:'Make the distributor step feel like the partner’s protection, not paperwork. Hashem explains that the discount is invisible if the partner goes to the distributor direct.',unk:'Agree the submission date and put it in the follow-up email.',voice:['pricing']},
   {cat:'Portal check',learn:'Can the partner actually log in and submit? Portal failure is the number-one known loss reason.',gen:'Any trouble logging into the portal?',top:'Share your screen for a second — if the portal throws anything, I’d rather raise it with Support while we’re both here than hear about it next week.',tech:'Fix it live. Hashem walks through the password reset and the admin-account fallback on the call rather than sending the partner to a queue.',unk:'Raise the ticket on the call; give the partner the ticket number.',voice:['portal']},
   {cat:'Registration confirmed',learn:'The record exists and the 30-day clock has started.',gen:'Did the registration go through?',top:'Read me the registration ID and I’ll put the expiry date in the follow-up, so we’re both working to the same day.',tech:'Capture the ID and the date on the call. Zime checks Salesforce and the portal afterwards and flags if no record appears within 48 hours.',unk:'—',voice:[]},
   {cat:'Path to the PO',learn:'Who raises the PO, what has to happen first, and when. Registration drops after 30 days without it.',gen:'What has to happen before the PO can be raised?',top:'Who at the customer physically raises the PO, what do they need in hand first, and which of those things can we do today?',tech:'Name the PO owner and the blockers. Leslie gives the partner the exact billing date and mechanism so finance has nothing left to ask.',unk:'Make it the partner’s action for the week; day-10 checkpoint confirms it.',voice:['timeline','stake']},
  ]},
 {id:'close',n:5,tab:'Close in 30 days',goal:'Convert the registration to a PO before the inventory lock expires; capture every objection on the way.',done:'PO received and inventory locked — or expiry reason logged and re-registered if it only slipped.',
  rows:[
   {cat:'Meeting plan',learn:'Which meetings get to a PO and who attends: demo, technical deep-dive, commercial review.',gen:'Which meetings get this to a PO?',top:'Let’s put three dates in now — demo, technical session, commercial review — who from the customer needs to be on each one?',tech:'Book all three while you have the partner. Leslie books the engineer-assisted session before the partner thinks to ask.',unk:'Book the demo only; set the rest as its exit action.',voice:['timeline','integ']},
   {cat:'Objection capture',learn:'What pushback the partner hears, from whom, fatal or recoverable.',gen:'What pushback are you hearing?',top:'What did they say when you named the price — and what would they need to see to say yes?',tech:'Ask for the customer’s words and the condition for yes. Ladan’s reframe on the Keyera call — customers don’t switch for “better”, only for “solves my problem” — is the lens.',unk:'If “they just said no”, ask what the customer would need to see to say yes.',voice:['pricing','gaps','bug','sec']},
   {cat:'Pricing response',learn:'What they are comparing against — licence price alone, or the cost of someone managing it.',gen:'What are they comparing us to?',top:'Are they comparing licence price to licence price, or the cost of someone actually watching the firewall? Let’s price the second one.',tech:'Reframe the basis of comparison before touching the number. Hashem answers price questions with the discount structure and registration thresholds, never a concession.',unk:'Use only the approved discount programme; never invent a discount.',voice:['pricing','mpssprice']},
   {cat:'Day-10 / 20 / 27 checkpoints',learn:'Is the PO on track, and what is blocking it?',gen:'Where is the PO?',top:'We’re ten days from losing the registered price — what’s blocking the PO, and which part of that can I unblock today?',tech:'Turn the deadline into a low-risk first step. Leslie points out the partner is only billed for what’s deployed, which makes starting small safe.',unk:'Escalate to the VP at day 27 if unconfirmed.',voice:['timeline']},
   {cat:'Expired',learn:'Dead deal or slipped paperwork — different responses.',gen:'Is the deal dead, or did the paperwork slip?',top:'If we re-registered today, what happens next week — is the customer still in, or did something change on their side?',tech:'Separate lost deals from lost paperwork. Acme tracks nothing after expiry today, so this question is also the data.',unk:'If the partner has gone quiet, it is a relationship problem — back to Know the partner.',voice:['stake','timeline']},
  ]},
 {id:'renew',n:6,tab:'Renewal & upgrade',goal:'Turn an asset review into a co-termed renewal, an end-of-life replacement, and an MPSS conversation.',done:'Asset list clean, renewal quote requested, EOL replacements sized, MPSS positioned where nobody is watching the firewall.',
  rows:[
   {cat:'Asset audit',learn:'What is installed, what is pinging home, what is out of support.',gen:'What’s installed, and what’s out of support?',top:'I’ve pulled your estate — here’s what’s reporting in and what’s gone quiet. Which of the quiet ones are still in use?',tech:'Bring the audit to the call. Ladan arrives with the master list already built; the customer only has to confirm and correct.',unk:'Pull the MyAcme report before the call; Zime attaches it to the prep note.',voice:['clarity','renew']},
   {cat:'Licence fit',learn:'Which devices need only support and which need the full suite.',gen:'Which of these sites face the internet, and which are private-only?',top:'Before I quote, I need to know which sites face the internet and which are closed networks — can you confirm, or should we ask the customer together?',tech:'Right-sizing before quoting earns the trust for the upgrade conversation. Tell the partner which devices need only support and warranty rather than quoting the full suite everywhere.',unk:'Send the subscription data sheet and make the site classification a joint action with the customer — the partner often will not know the topology.',voice:['clarity','pricing']},
   {cat:'End-of-life replacement',learn:'Which hardware is past last-order or retirement dates.',gen:'Any hardware past end of life?',top:'These units are past their last-order date, so no one-year renewal exists for them. Do you want the replacement conversation with the customer now, or when one fails?',tech:'Use lifecycle facts as the proof. Hashem walks the partner through the product lifecycle page so they can defend the replacement to their client.',unk:'Check the product lifecycle page for every Gen 6 device on the list.',voice:['eol','timeline']},
   {cat:'Co-term',learn:'Line renewals up so the customer has one date per tenant.',gen:'Would you like all renewals aligned to one date?',top:'If we lined everything up to one renewal date per tenant, which date would you pick?',tech:'Ask for the date, not permission. Ladan offers co-termination as a named mechanism in answer to a customer question about lining things up.',unk:'Offer to co-term at the next renewal event.',voice:['renew','timeline']},
   {cat:'MPSS on renewal',learn:'Every renewal at a customer with no one watching the firewall is an MPSS opportunity.',gen:'Who picks it up when something fails out of hours?',top:'The last time one of these sites went down outside working hours — who got the call, and how long before anyone noticed?',tech:'A last-incident question surfaces the managed-service need without pitching it, and the partner can answer from memory. On the Keyera call the customer described exactly this gap and MPSS was never raised.',unk:'Ask what happened the last time a device went down out of hours.',voice:['mpssmodel','mpssprice'],sig:'align'},
   {cat:'Training & support path',learn:'Whether the customer knows how to get help and learn the product.',gen:'Do you know how to reach support when you need it?',top:'Who on your side should have Acme University access and the escalation path — give me two names and I’ll set it up today.',tech:'Ask for names and close it on the call. Ladan turns a training request into an action with named people before the call ends.',unk:'Add the Acme University request and the support number to the follow-up.',voice:['enable','clarity']},
  ]},
];

  <div id="scatWrap"></div><div class="tip" id="tip"></div>
  <div class="legend"><span><i style="background:#C8372D"></i>Can kill the deal</span><span><i style="background:#B87400"></i>Depends</span><span><i style="background:#10233F"></i>Recoverable</span></div></div>
 <h2>Stuck by stage</h2><table class="t"><thead><tr><th>Stage</th><th>What it looks like</th><th>Reasons (from the log)</th><th>Playbook handling</th></tr></thead><tbody>${stuck.map(s=>`<tr><td><b>${esc(s.stage)}</b></td><td>${esc(s.where)}</td><td><div class="chips">${s.reasons.map(r=>`<span class="tag t-red">${esc(r)}</span>`).join('')}</div></td><td><div class="chips">${s.actions.map(a=>`<span class="tag t-blue">${esc(a)}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table>
 <h2>Competitor capture</h2><p class="sub" style="margin-bottom:8px">58 mentions is not enough to build a win-rate chart. The playbook makes “name the competitor” a mandatory action; this panel populates as it is asked.</p><div class="chips">${[['Fortinet',2],['WatchGuard',2],['Microsoft',2],['ZTNA alternatives',3],['Unnamed “alternative solutions”',2]].map(([n,c])=>`<span class="tag t-grey">${n} · ${c}</span>`).join('')}</div>`;}

function vReps(){const key=S.repSort;const rows=REPS.slice().sort((a,b)=>key==='adopt'?adopt(b)-adopt(a):b[key]-a[key]);function adopt(r){return Math.round(r.rec/(r.rec+r.sch)*100);}
 const th=(k,l,num=true)=>`<th class="s ${num?'num':''}" data-sort="${k}">${l}${key===k?' ▾':''}</th>`;
 return `<h1>Rep Leaderboard</h1><p class="sub">Partner-account owners as coded in the ROI workbook, ranked by what the playbook cares about. Adoption = calls recorded as a share of calls scheduled — Zime can only coach what it can hear.</p>
 <table class="t"><thead><tr><th>Owner</th>${th('p','Partners')}${th('rec','Recorded calls')}${th('adopt','Recording rate')}${th('regs','Registrations')}${th('mpss','MPSS regs')}${th('hi','High-intent, no MPSS')}<th>Coaching note</th></tr></thead><tbody>
 ${rows.map(r=>{const a=adopt(r);const note=r.hi>=3?'Run “Find the MPSS deal” with the high-intent partners':a<50?'Record the scheduled calls':r.mpss>=5?'Share phrasing with the team — top MPSS closer':r.p>=30&&r.rec<40?'Coverage too thin for the partner count':'On track';return `<tr><td><b>${esc(r.o)}</b></td><td class="num">${r.p}</td><td class="num">${r.rec}</td><td class="num"><span class="tag ${a>=70?'t-green':a>=50?'t-amber':'t-red'}">${a}%</span></td><td class="num">${r.regs.toLocaleString()}</td><td class="num">${r.mpss}</td><td class="num">${r.hi}</td><td>${note}</td></tr>`;}).join('')}</tbody></table>`;}

function vIntel(){return `<h1>Partner Intel</h1><p class="sub">Acme’s Gold / Platinum / Silver tiers are two years stale and self-declared. These tiers are computed from what the team observes on calls and what Zime scores. New applicants are screened against the ideal partner profile in <button class="link" data-go="playbooks" data-stage="recruit">Recruit &amp; onboard</button> before they get here.</p>
 <div class="form"><div class="field"><label>Quarters engaged (recorded call) in the last three</label><select id="t-eng"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></div><div class="field"><label>Highest MPSS deal-intent score (0–100)</label><input id="t-int" type="number" min="0" max="100" value="85"></div><div class="field"><label>MPSS registrations this year</label><input id="t-reg" type="number" min="0" value="0"></div><div class="field"><label>Registrations of any Acme product</label><input id="t-any" type="number" min="0" value="12"></div><div class="field"><label>Profile (from Know the partner)</label><select id="t-prof"><option value="tech" selected>Tech-forward</option><option value="trans">Transitional</option><option value="trad">Traditional (box-only)</option></select></div><div class="field"><label>Leads with a competitor and declines enablement</label><select id="t-comp"><option value="no" selected>No</option><option value="yes">Yes</option></select></div></div>
 <div class="tier" id="tierOut"></div>
 <h2>Definitions</h2><div class="defs"><div class="def"><b>Engaged</b>At least one recorded call with Acme’s team in the quarter (853 of 1,656 partners in the data year).</div><div class="def"><b>Product interest (0–100)</b>How strongly the partner engaged with a product on calls. No specific deal implied. Low 0–30 · Medium 31–79 · High 80–100.</div><div class="def"><b>Deal intent (0–100)</b>Whether a specific opportunity was described. High: named customer + use case + two of demo / scope / quote / timeline. Medium: named customer or use case plus one more. Low: product discussed, no customer.</div><div class="def"><b>Tech-forward</b>The channel manager’s call: can this partner sell and support a managed monthly service?</div></div>
 <h2>Tier rules</h2><table class="t"><thead><tr><th>Tier</th><th>Rule</th><th>Treatment</th></tr></thead><tbody><tr><td><span class="tag t-green">Focus</span></td><td>Engaged ≥ 2 of 3 quarters, and (MPSS intent ≥ 80 or ≥ 1 MPSS registration), and tech-forward.</td><td>Weekly touch; MPSS on every call; joint demos first. Today: 33 partners with MPSS registrations + 48 high-intent with none.</td></tr><tr><td><span class="tag t-amber">Develop</span></td><td>Engaged ≥ 1 quarter, registers other Acme products, MPSS intent below 80 or never discussed.</td><td>Introduce MPSS with a named-customer use case; enablement within 30 days.</td></tr><tr><td><span class="tag t-grey">Maintain</span></td><td>Registers regularly, traditional profile, MPSS interest below 31.</td><td>Supply-side support only.</td></tr><tr><td><span class="tag t-red">Deprioritize</span></td><td>No engagement and no registrations — or leads with a competitor and declines enablement.</td><td>Low-touch nurture.</td></tr></tbody></table>`;}
function computeTier(){const eng=+$('#t-eng').value,int=+$('#t-int').value,reg=+$('#t-reg').value,any=+$('#t-any').value,prof=$('#t-prof').value,comp=$('#t-comp').value;let t,why;
 if(comp==='yes'||(eng===0&&any===0&&reg===0)){t='Deprioritize';why=comp==='yes'?'Leads with a competitor and declines enablement.':'No engagement and no registrations in the data year.';}
 else if(eng>=2&&(int>=80||reg>=1)&&prof==='tech'){t='Focus';why=`Engaged ${eng} quarters; ${reg>=1?reg+' MPSS registration'+(reg>1?'s':''):'MPSS intent '+int}; tech-forward.`;}
 else if(any>=1&&prof==='trad'&&int<31){t='Maintain';why='Registers regularly but a traditional, box-only profile with low MPSS interest.';}
 else if(eng>=2&&(int>=80||reg>=1)){t='Develop';why='Strong MPSS signal but the profile is not yet tech-forward — enable before pushing.';}
 else{t='Develop';why=`Engaged and registering other Acme products (${any}); MPSS intent ${int} — not yet a specific opportunity.`;}
 const tr={Focus:'Weekly touch; MPSS on every call; joint demos first.',Develop:'Introduce MPSS with a named-customer use case; enablement within 30 days.',Maintain:'Supply-side support only.',Deprioritize:'Low-touch nurture.'}[t];
 const o=$('#tierOut');o.className='tier '+t.toLowerCase();o.innerHTML=`<div class="n">${t}</div><div style="margin:2px 0 6px">${why}</div><div style="color:var(--mute)">${tr}</div>`;}

/* ======================= HELPERS: ask / email / prep ======================= */
function answerFor(c,q){q=q.toLowerCase();const items=callState(c);const hits=[];
 if(/objection|pushback|concern/.test(q))hits.push(`${c.objections.length} objections: `+c.objections.map(o=>`${o.t} (${o.sev}, ${o.at})`).join('; ')+'.');
 if(/next|follow|action|todo/.test(q))hits.push('Next-call gaps: '+c.next.join(', ')+'. Open items: '+c.crm.filter(([k])=>/next|homework|reseller/i.test(k)).map(([k,v])=>v).join(' · '));
 if(/mpss/.test(q))hits.push(c.crm.find(([k])=>k==='MPSS')?`MPSS: ${c.crm.find(([k])=>k==='MPSS')[1]}.`:'MPSS was not discussed.');
 if(/talk|speak|time/.test(q))hits.push('Talk time: '+c.speakers.map(([n,p])=>`${n} ${p}%`).join(', ')+'. '+c.talkFlag);
 if(/stage/.test(q))hits.push(`Detected stage: ${c.stageLabel}. CRM says ${c.crmStage}.`);
 if(/ready|register/.test(q))hits.push('See the readiness panel on the right; registration mechanics discussed: '+(items.find(i=>i.cat==='Prompt the registration'&&i.st==='cov')?'yes':'no')+'.');
 const kw=q.split(/\W+/).filter(w=>w.length>3);const ev=[];[...c.objections.map(o=>({t:o.q,at:o.at})),...items.filter(i=>i.ev).map(i=>({t:i.ev,at:i.at}))].forEach(e=>{if(kw.some(w=>e.t.toLowerCase().includes(w)))ev.push(`${e.t} (${e.at})`);});
 if(ev.length)hits.push('From the call: '+ev.slice(0,3).join(' · '));
 if(!hits.length)hits.push(`Nothing specific on “${q}” in this call. Try: objections, next steps, MPSS, talk time, portal, pricing, renewal.`);
 return hits.join('<br><br>');}
function emailFor(c){return `Subject: Follow-up — ${c.title.split(' — ')[0]}\n\nHi ${c.mail.to},\n\n`+c.mail.lines.map(l=>'• '+l).join('\n')+`\n\nBest,\n${c.rep.split(' ')[0]}`;}
function prepFor(c){const items=callState(c);const miss=items.filter(i=>i.st!=='cov');return `Prep for the next call with ${c.with.split(' (')[0]}\n\nNot yet covered:\n`+miss.map(i=>{const row=stageById(i.stage).rows.find(r=>r.cat===i.cat);return `• ${i.cat} — ask: “${row?row.top:''}”`;}).join('\n')+`\n\nOpen objections to close:\n`+c.objections.filter(o=>o.sev!=='Low').map(o=>`• ${o.t} → ${o.route}`).join('\n');}


/* ======================= CHARTS (drawn at pixel size, fixed type) ======================= */
const FS=12;
function drawMovement(){const el=$('#mvChart');if(!el)return;const W=Math.max(360,el.clientWidth),H=240,L=8,R=8,T=28,B=H-32;const n=MONTHS.length,slot=(W-L-R)/n,bw=Math.min(44,slot*.55);
 const maxRec=Math.max(...M_REC),maxM=Math.max(...M_MPSS),ph=B-T;
 const bars=M_REC.map((v,i)=>{const x=L+i*slot+(slot-bw)/2,h=v/maxRec*ph;return `<rect x="${x}" y="${B-h}" width="${bw}" height="${h}" fill="#D6E0FF" rx="3"/><text x="${x+bw/2}" y="${B-h-6}" text-anchor="middle" font-size="${FS-1}" fill="#5E6873">${v}</text><text x="${x+bw/2}" y="${B+18}" text-anchor="middle" font-size="${FS}" fill="#5E6873">${MONTHS[i]}</text>`;}).join('');
 const pts=M_MPSS.map((v,i)=>[L+i*slot+slot/2,B-v/maxM*ph*.9]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0E7C7B" stroke="#fff" stroke-width="1.5"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#000">${M_MPSS[i]}</text>`).join('');
 el.innerHTML=`<svg width="${W}" height="${H}" style="display:block"><line x1="${L}" y1="${B}" x2="${W-R}" y2="${B}" stroke="#E3E8EE"/>${bars}<path d="${line}" fill="none" stroke="#0E7C7B" stroke-width="2"/>${dots}</svg>`;}
function drawScatter(){const el=$('#scatWrap');if(!el)return;const W=Math.max(360,el.clientWidth),H=330,L=44,R=150,T=40,B=H-44;const max=Math.max(...OBJ.map(o=>o.n));const xmax=35;
 const X=v=>L+v/xmax*(W-L-R),Y=v=>B-v/max*(B-T);
 const pts=OBJ.map((o,i)=>({o,i,hs:o.hi/o.n*100,x:X(o.hi/o.n*100),y:Y(o.n)}));
 const grid=[0,10,20,30].map(v=>`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${B}" stroke="#EEF1F5"/><text x="${X(v)}" y="${B+18}" font-size="${FS}" fill="#5E6873" text-anchor="middle">${v}%</text>`).join('');
 const ygrid=[100,200,300,400].map(v=>v<=max*1.05?`<line x1="${L}" y1="${Y(v)}" x2="${W-R+40}" y2="${Y(v)}" stroke="#EEF1F5"/><text x="${L-6}" y="${Y(v)+4}" font-size="${FS-1}" fill="#5E6873" text-anchor="end">${v}</text>`:'').join('');
 const labelled=new Set(['Feature clarity & support','Feature gaps & requests','Budget / pricing','Integration & compatibility','MPSS-specific','Product bug','Security / compliance','Sales enablement']);
 const circles=pts.map(p=>`<circle data-i="${p.i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(5+p.o.n/max*5).toFixed(1)}" fill="${p.o.kind==='fatal'?'#C8372D':p.o.kind==='dep'?'#B87400':'#10233F'}" fill-opacity=".9" style="cursor:pointer"/>`).join('');
 const labels=pts.filter(p=>labelled.has(p.o.cat)).map(p=>{const below=/MPSS|Sales/.test(p.o.cat);return `<text x="${(p.x+(below?0:11)).toFixed(1)}" y="${(p.y+(below?18:4)).toFixed(1)}" font-size="${FS}" fill="#000" text-anchor="${below?'middle':'start'}">${esc(p.o.cat)}</text>`;}).join('');
 el.innerHTML=`<svg width="${W}" height="${H}" id="scat" style="display:block">${ygrid}${grid}<line x1="${L}" y1="${B}" x2="${W-R+40}" y2="${B}" stroke="#E3E8EE"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#E3E8EE"/><text x="${W-R+40}" y="${B+36}" font-size="${FS}" fill="#5E6873" text-anchor="end">share graded high severity →</text><text x="${L-30}" y="14" font-size="${FS}" fill="#5E6873">objections logged ↑</text>${circles}${labels}</svg>`;
 const tip=$('#tip');$$('circle[data-i]',el).forEach(ci=>{ci.onmousemove=e=>{const o=OBJ[+ci.dataset.i];const r=el.parentElement.getBoundingClientRect();tip.style.display='block';tip.style.left=(e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top-10)+'px';tip.innerHTML=`<b>${esc(o.cat)}</b><br>${o.n} logged · ${o.hi} high severity (${Math.round(o.hi/o.n*100)}%)<br>Owner: ${esc(o.owner)}`;};ci.onmouseleave=()=>tip.style.display='none';});}
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{drawMovement();drawScatter();},120);});

/* ======================= BIND ======================= */
function bind(){const m=$('#main');
 $$('[data-stage]',m).forEach(b=>b.onclick=()=>{S.stage=b.dataset.stage;if(b.dataset.go)S.view=b.dataset.go;save();render();});
 $$('[data-go]').forEach(b=>b.onclick=()=>{S.view=b.dataset.go;if(b.dataset.stage)S.stage=b.dataset.stage;save();render();scrollTo({top:0});});
 $$('[data-check]',m).forEach(c=>c.onchange=()=>{S.checks[c.dataset.check]=c.checked;save();render();});
 $$('[data-copy]',m).forEach(b=>b.onclick=()=>copy(b.dataset.copy));
 $$('[data-note]',m).forEach(b=>b.onclick=()=>{const ta=$(`textarea[data-notekey="${b.dataset.note}"]`,m);ta.classList.toggle('show');if(ta.classList.contains('show'))ta.focus();});
 $$('[data-notekey]',m).forEach(t=>t.oninput=()=>{S.notes[t.dataset.notekey]=t.value;save();});
 $$('[data-call]',m).forEach(b=>b.onclick=()=>{S.call=b.dataset.call;save();render();});
 $$('.sec>button',m).forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
 $$('[data-over]',m).forEach(s=>s.onchange=()=>{S.over[s.dataset.over]=s.value;save();render();});
 const c=CALLS.find(x=>x.id===S.call);
 if($('#askBtn')){const go=()=>{const q=$('#askq').value.trim();if(!q)return;const a=$('#answer');a.innerHTML=answerFor(c,q);a.classList.add('show');};$('#askBtn').onclick=go;$('#askq').onkeydown=e=>{if(e.key==='Enter')go();};
  $('#mailBtn').onclick=()=>{const el=$('#mail');el.textContent=emailFor(c);el.classList.toggle('show');$('#prep').classList.remove('show');};
  $('#prepBtn').onclick=()=>{const el=$('#prep');el.textContent=prepFor(c);el.classList.toggle('show');$('#mail').classList.remove('show');};
  $('#copyCrm').onclick=()=>copy(c.crm.map(([k,v])=>`${k}: ${v}`).join('\n'));}
 if($('#tierOut')){['t-eng','t-int','t-reg','t-any','t-prof','t-comp'].forEach(id=>$('#'+id).oninput=computeTier);computeTier();}
 $$('th[data-sort]',m).forEach(h=>h.onclick=()=>{S.repSort=h.dataset.sort;save();render();});
 drawMovement();drawScatter();
}
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#resetBtn').onclick=()=>{S.checks={};S.notes={};S.over={};save();render();toast('Reset');};
function buildNotes(){const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});let out=`Acme partner call — ${d}\n`;STAGES.forEach(s=>{const lines=[];s.rows.forEach((r,i)=>{const k=s.id+':'+i;if(S.checks[k]||S.notes[k])lines.push(`  ${S.checks[k]?'[x]':'[ ]'} ${r.cat}${S.notes[k]?' — '+S.notes[k].trim():''}`);});if(lines.length)out+=`\n${s.tab}\n${lines.join('\n')}\n`;});return out;}
$('#notesBtn').onclick=()=>{$('#notesText').value=buildNotes();$('#drawer').classList.add('show');};
$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('show');$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')$('#drawer').classList.remove('show');});
$('#copyNotes').onclick=()=>copy($('#notesText').value);document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('show');});
render();
</script>
